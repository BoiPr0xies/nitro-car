<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1730">
  <title>Nitro Car</title>
  <style>
    html, body, #game-shell { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0a1730; }
    #game-shell:fullscreen { width: 100%; height: 100%; }
    #game { display: block; width: 100%; height: 100%; border: 0; }
    #start, #error { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0, 0, 0, .65); }
    #start[hidden], #error[hidden] { display: none; }
    #error { color: white; font: 16px system-ui, sans-serif; text-align: center; }
    button { border: 0; padding: 24px 64px; color: white; background: transparent; font: 600 30px system-ui, sans-serif; cursor: pointer; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main id="game-shell">
    <iframe id="game" title="Nitro Car game" allow="autoplay; fullscreen; gamepad; clipboard-write" allowfullscreen></iframe>
    <div id="start"><button id="play" type="button">Play</button></div>
    <div id="error" hidden><div><p>The game could not load.</p><button id="retry" type="button">RETRY</button></div></div>
  </main>
  <script>
    const shell = document.getElementById('game-shell');
    const game = document.getElementById('game');
    const start = document.getElementById('start');
    const errorMessage = document.getElementById('error');
    let artworkTimer;
    let artworkDocument;
    let artworkSheet;
    let artworkSelectors = [];
    const artworkData = new Map();

    // Firefox can decode the game's blob images but fail to paint them as CSS
    // backgrounds. Render the same images as inert child elements instead.
    function updateArtwork() {
      const doc = game.contentDocument;
      if (!doc?.body || !game.hasAttribute('srcdoc')) return;
      const sheet = doc.querySelector('style[data-launcher-artwork]')?.sheet;
      if (doc !== artworkDocument || sheet !== artworkSheet) {
        artworkDocument = doc;
        artworkSheet = sheet;
        artworkSelectors = [];
        artworkData.clear();
        function collectSelectors(rules) {
          for (const rule of rules) {
            if (rule.selectorText && rule.style) {
              const value = rule.style.getPropertyValue('background-image') || rule.style.getPropertyValue('background');
              const name = value.match(/var\((--lobby-art-[\w-]+)/)?.[1];
              if (name) artworkSelectors.push([rule.selectorText, name]);
            } else if (rule.cssRules) collectSelectors(rule.cssRules);
          }
        }
        if (sheet) collectSelectors(sheet.cssRules);
      }
      for (const tile of doc.querySelectorAll('.mode-art, .roadster-mode-art, #cq svg.gq')) {
        const style = doc.defaultView.getComputedStyle(tile);
        const mapping = artworkSelectors.find(([selector]) => tile.matches(selector));
        const value = mapping ? doc.documentElement.style.getPropertyValue(mapping[1]) : style.backgroundImage;
        const url = value.match(/^url\(["']?(blob:[^"')]+)["']?\)$/)?.[1];
        const svg = tile.namespaceURI === 'http://www.w3.org/2000/svg';
        let image = tile.querySelector(':scope > [data-launcher-art]');
        if (!url) {
          if (image) image.remove();
          continue;
        }
        if (!image) {
          image = svg ? doc.createElementNS('http://www.w3.org/2000/svg', 'image') : doc.createElement('img');
          image.dataset.launcherArt = '';
          image.setAttribute('aria-hidden', 'true');
          if (svg) {
            image.setAttribute('width', '100%');
            image.setAttribute('height', '100%');
            image.setAttribute('preserveAspectRatio', 'xMidYMid slice');
            image.style.pointerEvents = 'none';
            tile.prepend(image);
          } else {
            image.alt = '';
            image.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;pointer-events:none;';
            if (style.position === 'static') tile.style.position = 'relative';
            tile.append(image);
          }
        }
        if (image.dataset.launcherSource !== url) {
          image.dataset.launcherSource = url;
          if (svg) image.setAttribute('href', url); else image.src = url;
          // Use the already-loaded image bytes as a data URL so painting does
          // not depend on Firefox's handling of blob URLs in nested frames.
          if (!artworkData.has(url)) {
            if (artworkData.size >= 64) artworkData.clear();
            artworkData.set(url, fetch(url).then(response => {
              if (!response.ok) throw new Error('Artwork unavailable');
              return response.blob();
            }).then(blob => new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result);
              reader.onerror = () => reject(reader.error);
              reader.readAsDataURL(blob);
            })).catch(() => null));
          }
          artworkData.get(url).then(data => {
            if (data && image.isConnected && image.dataset.launcherSource === url) {
              if (svg) image.setAttribute('href', data); else image.src = data;
            }
          });
        }
        if (!svg && image.style.objectPosition !== style.backgroundPosition) image.style.objectPosition = style.backgroundPosition;
      }
    }
    const mirrors = [
      'https://cdn.jsdelivr.net/gh/nitrocargit/files@',
      'https://fastly.jsdelivr.net/gh/nitrocargit/files@',
      'https://cdn.jsdelivr.fyi/gh/nitrocargit/files@',
      'https://cdn.jsdmirror.com/gh/nitrocargit/files@',
      'https://raw.esm.sh/gh/nitrocargit/files@',
      'https://raw.githack.com/nitrocargit/files/'
    ];

    async function fetchRelease(mirror, controller) {
      const timer = setTimeout(() => controller.abort(), 10000);
      try {
          const latest = await fetch(mirror + 'main/latest.json', { cache: 'no-store', signal: controller.signal });
          if (!latest.ok) throw new Error('Release metadata unavailable');
          const { commit } = await latest.json();
          if (!/^[0-9a-f]{40}$/.test(commit)) throw new Error('Invalid release commit');
          const base = mirror + commit + '/';
          const response = await fetch(base + 'index.html', { signal: controller.signal });
          if (!response.ok) throw new Error('Game entry unavailable');
          const html = await response.text();
          if (!/<head(?:\s[^>]*)?>/i.test(html)) throw new Error('Invalid game entry');
          // Template content is inert, so inspecting it cannot start the
          // release's module preloads against the launcher's own origin.
          const template = document.createElement('template');
          template.innerHTML = html;
          const modulePath = template.content.querySelector('script[type="module"][src]')?.getAttribute('src');
          const styleLink = template.content.querySelector('link[rel="stylesheet"][href]');
          const stylePath = styleLink?.getAttribute('href');
          if (!modulePath || !stylePath) throw new Error('Game assets missing');
          const checks = [[modulePath, /(?:javascript|ecmascript)/i], [stylePath, /text\/css/i]];
          const assets = await Promise.all(checks.map(async ([path, type], index) => {
            const url = new URL(path, base);
            if (!url.href.startsWith(base)) throw new Error('Unexpected game asset path');
            const asset = await fetch(url, { method: index === 1 ? 'GET' : 'HEAD', signal: controller.signal, ...(index === 1 && styleLink.integrity ? { integrity: styleLink.integrity } : {}) });
            if (!asset.ok || !type.test(asset.headers.get('content-type') || '')) throw new Error('Game asset unavailable');
            return index === 1 ? asset.text() : null;
          }));
          // Firefox applies the CDN stylesheet's principal to blob URLs used in
          // its rules. Re-declare only menu-art backgrounds in this document.
          let artworkRules = '';
          try {
            const sheet = new CSSStyleSheet();
            sheet.replaceSync(assets[1]);
            function collect(rules) {
              return Array.from(rules, rule => {
                if (rule.selectorText && rule.style) {
                  return ['background-image', 'background'].map(property => {
                    const value = rule.style.getPropertyValue(property);
                    return value.includes('--lobby-art-') ? rule.selectorText + '{' + property + ':' + value + ' !important}' : '';
                  }).join('');
                }
                if (rule.cssRules) {
                  const inner = collect(rule.cssRules);
                  const open = rule.cssText.indexOf('{');
                  return inner && open > 0 ? rule.cssText.slice(0, open) + '{' + inner + '}' : '';
                }
                return '';
              }).join('');
            }
            artworkRules = collect(sheet.cssRules).replace(/<\/style/gi, '<\\/style');
          } catch (error) {
            console.warn('Could not prepare menu image compatibility rules:', error);
          }
          // Firefox may speculatively request relative head assets before it
          // processes the injected base. Resolve those references in advance.
          const headEnd = html.search(/<\/head\s*>/i);
          if (headEnd < 0) throw new Error('Game head is incomplete');
          const head = html.slice(0, headEnd).replace(/<(?:script|link)\b[^>]*>/gi, tag => tag.replace(/(\b(?:src|href)\s*=\s*)(["'])([^"']+)\2/i, (match, prefix, quote, path) => {
            if (/^(?:[a-z][a-z0-9+.-]*:|\/|#|\?)/i.test(path)) return match;
            const url = new URL(path, base);
            return url.href.startsWith(base) ? prefix + quote + url.href + quote : match;
          }));
          return (head + html.slice(headEnd)).replace(/<head(?:\s[^>]*)?>/i, opening => opening + '<base href="' + base + '">' + (artworkRules ? '<style data-launcher-artwork>' + artworkRules + '</style>' : ''));
      } finally {
        clearTimeout(timer);
      }
    }

    // Batches: the two original hosts go first, one after the other; if the
    // first has not answered after HEDGE_DELAY the next batch starts alongside
    // it instead of waiting for a ten second timeout. A batch that fails
    // entirely starts the next one at once. The first valid release wins.
    const tiers = [[0], [1], [2, 3, 4, 5]];
    const HEDGE_DELAY = 3500;
    function raceMirrors() {
      const controllers = mirrors.map(() => new AbortController());
      return new Promise((resolve, reject) => {
        let next = 0, active = 0, finished = false, timer;
        const launch = () => {
          clearTimeout(timer);
          if (finished || next >= tiers.length) return;
          for (const i of tiers[next++]) {
            active++;
            fetchRelease(mirrors[i], controllers[i]).then(html => {
              if (finished) return;
              finished = true;
              clearTimeout(timer);
              controllers.forEach((controller, j) => { if (j !== i) controller.abort(); });
              resolve(html);
            }, error => {
              console.warn('Game mirror failed:', mirrors[i], error);
              active--;
              if (finished || active > 0) return;
              if (next < tiers.length) launch(); else { finished = true; reject(error); }
            });
          }
          if (next < tiers.length) timer = setTimeout(launch, HEDGE_DELAY);
        };
        launch();
      });
    }

    async function loadGame() {
      errorMessage.hidden = true;
      try {
        const html = await raceMirrors();
        clearInterval(artworkTimer);
        game.srcdoc = html;
        artworkTimer = setInterval(updateArtwork, 1000);
      } catch (error) {
        console.warn('Game mirrors failed:', error);
        errorMessage.hidden = false;
        document.getElementById('retry').focus();
      }
    }
    document.getElementById('retry').addEventListener('click', loadGame);
    loadGame();
    start.addEventListener('click', async () => {
      start.hidden = true;
      try {
        // Firefox renders the game's WebGL scene black after fullscreen, so it keeps the window instead.
        if (shell.requestFullscreen && !/firefox/i.test(navigator.userAgent)) await shell.requestFullscreen();
      } catch (error) {
        console.warn('Fullscreen unavailable:', error);
      }
      game.focus();
    });
  </script>
</body>
</html>
